<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI SOC Triage Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #0a0e17; --surface: #111827; --surface-2: #1a2234; --border: #2a3548; --text: #e2e8f0; --text-muted: #8892a4; --accent: #3b82f6; --green: #22c55e; --red: #ef4444; --amber: #f59e0b; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 40px; height: 40px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.logo h1 { font-size: 18px; font-weight: 600; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.status-dot.connected { background: var(--green); }
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab-btn { padding: 14px 24px; background: none; border: none; color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.container { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; }
.section-header { padding: 16px 20px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.command-btn { display: block; width: calc(100% - 16px); margin: 4px 8px; padding: 12px 14px; background: transparent; border: none; border-radius: 6px; color: var(--text); font-size: 14px; text-align: left; cursor: pointer; transition: 0.15s; }
.command-btn:hover { background: var(--surface-2); }
.command-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.stats-box { padding: 16px 20px; border-top: 1px solid var(--border); }
.stat { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.stat-val { font-weight: 500; color: var(--accent); }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.content { flex: 1; overflow-y: auto; display: none; }
.content.active { display: block; }
.chat-panel { display: flex; flex-direction: column; height: 100%; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { white-space: pre-wrap; max-width: 80%; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
.msg.user { background: #1e3a5f; align-self: flex-end; }
.msg.assistant { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; }
.msg.system { background: var(--surface-2); align-self: center; max-width: 90%; color: var(--text-muted); font-size: 12px; }
.msg.error { background: #3b1111; color: #fca5a5; }
.msg.action { background: #0a3d1f; border: 1px solid var(--green); }
.msg-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; opacity: 0.8; }
.input-box { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
#inp { flex: 1; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
#inp:focus { outline: none; border-color: var(--accent); }
#send { padding: 10px 20px; background: var(--accent); border: none; border-radius: 6px; color: white; font-weight: 500; cursor: pointer; }
#send:hover { opacity: 0.9; }
.dashboard { padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.card-title { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
.card-value { font-size: 36px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.card-label { font-size: 12px; color: var(--text-muted); }
.full { grid-column: 1 / -1; }
.chart { position: relative; height: 280px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <h1>AI SOC Triage Agent</h1>
  </div>
  <div class="status">
    <div class="status-dot" id="dot"></div>
    <span id="stat">Connecting...</span>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('chat')">💬 Chat Triage</button>
  <button class="tab-btn" onclick="switchTab('dashboard')">📊 Metrics</button>
</div>

<div class="container">
  <div class="sidebar">
    <div class="section-header">Commands</div>
    <button class="command-btn" onclick="send('fetch alerts')">fetch alerts<div class="command-desc">Get recent alerts</div></button>
    <button class="command-btn" onclick="send('agents')">agents<div class="command-desc">List agents</div></button>
    <button class="command-btn" onclick="send('history')">history<div class="command-desc">Triage history</div></button>
    <button class="command-btn" onclick="send('reset')">reset<div class="command-desc">New conversation</div></button>
    
    <div class="stats-box">
      <div class="stat"><span>Connection</span><span class="stat-val" id="conn">Offline</span></div>
      <div class="stat"><span>Triaged</span><span class="stat-val" id="triaged">0</span></div>
      <div class="stat"><span>Session</span><span class="stat-val" id="time">--</span></div>
    </div>
  </div>

  <div class="main">
    <div id="chat" class="content active">
      <div class="chat-panel">
        <div class="messages" id="msgs"></div>
        <div class="input-box">
          <input type="text" id="inp" placeholder="Ask about alerts, triage, threats..." autocomplete="off">
          <button id="send" onclick="sendMsg()">Send</button>
        </div>
      </div>
    </div>

    <div id="dashboard" class="content">
      <div class="dashboard">
        <div class="card">
          <div class="card-title">Total Alerts Triaged</div>
          <div class="card-value" id="total">0</div>
          <div class="card-label">in this session</div>
        </div>
        <div class="card">
          <div class="card-title">Avg Triage Time</div>
          <div class="card-value" id="avgtime"><small>--</small></div>
          <div class="card-label">per alert</div>
        </div>
        <div class="card">
          <div class="card-title">Alerts / Hour</div>
          <div class="card-value" id="perhr">0</div>
          <div class="card-label">velocity</div>
        </div>
        <div class="card">
          <div class="card-title">Actions Approved</div>
          <div class="card-value" id="approvals">0</div>
          <div class="card-label">executed</div>
        </div>
        <div class="card full">
          <div class="card-title">Severity Breakdown</div>
          <div class="chart"><canvas id="sev-chart"></canvas></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let ws, chart;

function switchTab(tab) {
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
  if (tab === 'dashboard') updateMetrics();
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/chat`);
  
  ws.onopen = () => {
    document.getElementById('dot').classList.add('connected');
    document.getElementById('stat').textContent = 'Connected';
    document.getElementById('conn').textContent = 'Online';
    document.getElementById('time').textContent = new Date().toLocaleTimeString();
    setInterval(updateMetrics, 3000);
  };
  
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    addMsg(d.type, d.message);
    if (d.type === 'triage') document.getElementById('triaged').textContent = parseInt(document.getElementById('triaged').textContent) + 1;
  };
  
  ws.onclose = () => {
    document.getElementById('dot').classList.remove('connected');
    document.getElementById('stat').textContent = 'Disconnected';
    setTimeout(connect, 3000);
  };
}

function addMsg(t, txt) {
  const m = document.createElement('div');
  m.className = `msg ${t}`;
  m.textContent = txt;
  const tm = document.createElement('div');
  tm.className = 'msg-time';
  tm.textContent = new Date().toLocaleTimeString();
  m.appendChild(tm);
  document.getElementById('msgs').appendChild(m);
  document.getElementById('msgs').scrollTop = 9999;
}

function send(text) {
  document.getElementById('inp').value = text;
  sendMsg();
}

function sendMsg() {
  const txt = document.getElementById('inp').value.trim();
  if (!txt || !ws || ws.readyState !== 1) return;
  addMsg('user', txt);
  ws.send(txt);
  document.getElementById('inp').value = '';
}

async function updateMetrics() {
  try {
    const [sum, sev] = await Promise.all([
      fetch('/api/metrics/summary').then(r => r.json()),
      fetch('/api/metrics/severity').then(r => r.json())
    ]);
    
    document.getElementById('total').textContent = sum.total_triaged || 0;
    document.getElementById('avgtime').textContent = sum.avg_triage_time_ms ? sum.avg_triage_time_ms + 'ms' : '--';
    document.getElementById('perhr').textContent = Math.round(sum.alerts_per_hour || 0);
    document.getElementById('approvals').textContent = sum.total_approvals || 0;
    
    if (sev && sev.length > 0) {
      const labels = sev.map(s => s.name);
      const vals = sev.map(s => s.value);
      const ctx = document.getElementById('sev-chart').getContext('2d');
      
      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = vals;
        chart.update();
      } else {
        chart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: vals,
              backgroundColor: ['#ef4444', '#f59e0b', '#eab308', '#22c55e', '#6b7280'],
              borderColor: '#111827',
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#e2e8f0' } } }
          }
        });
      }
    }
  } catch (e) { console.log(e); }
}

document.getElementById('inp').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
connect();
</script>
</body>
</html>
